<text x="602.0" y="313.0" text-anchor="middle" font-size="16" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400" fill="#627888">parameters</text>
<line x1="708.0" y1="286.0" x2="723.0" y2="286.0" stroke="#c46b32" stroke-width="3"/><polygon points="723.0,286.0 711.9,292.8 711.9,279.2" fill="#c46b32"/>
