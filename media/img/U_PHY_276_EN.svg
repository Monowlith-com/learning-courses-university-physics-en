<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-label="Two left-chiral lepton-doublet components combine weak isospin and hypercharge contributions to give zero and minus one."><title>Standard Model, Gauge Groups and Electric Charge</title><rect x="0" y="0" width="860" height="470" rx="0" fill="white" stroke="white" stroke-width="1.6"/><text x="36.0" y="57.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#263545" text-anchor="start" font-weight="bold">Standard Model, Gauge Groups and Electric Charge</text><line x1="42.00" y1="81.00" x2="819.00" y2="81.00" stroke="#cad4df" stroke-width="1.4" /><rect x="95" y="148" width="668" height="245" rx="8" fill="#f7fafc" stroke="#cad4df" stroke-width="1.6"/><text x="428.0" y="188.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#1c6f9d" text-anchor="middle" font-weight="normal">SU(2) × U(1)</text><rect x="133" y="233" width="585" height="78" rx="8" fill="white" stroke="#cad4df" stroke-width="1.6"/><text x="176.0" y="281.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#218475" text-anchor="start" font-weight="normal">νₗ</text><text x="307.0" y="281.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#263545" text-anchor="start" font-weight="normal">T₃ = +1/2</text><text x="478.0" y="281.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#263545" text-anchor="start" font-weight="normal">Y = −1</text><text x="647.0" y="281.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#218475" text-anchor="middle" font-weight="normal">Q = 0</text><rect x="133" y="338" width="585" height="78" rx="8" fill="white" stroke="#cad4df" stroke-width="1.6"/><text x="176.0" y="386.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#bd594c" text-anchor="start" font-weight="normal">eₗ</text><text x="307.0" y="386.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#26354