<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Two probability bars for a canonical two-level system: ground state 73.1 percent, excited state 26.9 percent">
<title>Two-Level Boltzmann Distribution</title>
<desc>At beta times epsilon equal to one, excitation probability is about 0.269.</desc>
<rect x="0" y="0" width="960" height="600" rx="0" fill="white" stroke="white"/>
<text x="39.0" y="44.0" fill="#12314f" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">Two-Level Boltzmann Distribution</text>
<text x="40.0" y="75.0" fill="#61758a" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">At beta times epsilon equal to one, excitation probability is about 0.269.</text>
<line x1="40.0" y1="96.0" x2="920.0" y2="96.0" stroke="#d8e3eb" stroke-width="1" />
<text x="92.0" y="149.0" fill="#12314f" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">βε = 1</text>
<text x="100.0" y="207.0" fill="#12314f" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">Ground state</text>
<rect x="100" y="246" width="700" height="75" rx="6" fill="#f5f5f5" stroke="#d8e3eb"/>
<rect x="100" y="246" width="511.741006" height="75" rx="6" fill="#1874a8" stroke="#1874a8"/>
<text x="814.0" y="292.0" fill="#25394b" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start">73.1 %</text>
<text x="100.0" y="344.0" fill="#12314f" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">Excited</text>
<rect x="100" y="383" width="700" height="75" rx="6" fill="#f5f5f5" stroke="#d8e3eb"/>
<rect x="100" y="383" width="188.258994" height="75" rx="6" fill="#d97738" stroke="#d97738"/>
<text x="814.0" y="429.0" fill="#25394b" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start">26.9 %</text>
<text x="470.0" y="545.0" fill="#61758a" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle">Total probability: 100 %</text>
</svg>
