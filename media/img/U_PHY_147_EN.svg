<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Laser cavity with two mirrors and a gain medium"><title>Optical Cavity and Gain Threshold</title><desc>Gain and mirror losses are balanced per round trip.</desc><defs><marker id="arr" viewBox="0 0 10 8" markerWidth="9" markerHeight="7" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#0c6c85"/></marker></defs><rect x="0" y="0" width="960" height="600" rx="1" fill="white" stroke="white" stroke-width="0"/><text x="43" y="50" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#243340" font-weight="700" text-anchor="start">Optical Cavity and Gain Threshold</text><text x="43" y="83" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#61707c" font-weight="400" text-anchor="start">Gain and mirror losses are balanced per round trip.</text><line x1="43" y1="105" x2="917" y2="105" stroke="#bbc5c9" stroke-width="1"/><text x="260" y="166" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#243340" font-weight="700" text-anchor="middle">Rear mirror</text><text x="739" y="166" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#243340" font-weight="700" text-anchor="middle">Output coupler</text><line x1="246" y1="206" x2="246" y2="384" stroke="#243340" stroke-width="9"/><line x1="742" y1="206" x2="742" y2="384" stroke="#243340" stroke-width="9"/><rect x="370" y="190" width="244" height="200" rx="8" fill="#f6f6f6" stroke="#0c6c85" stroke-width="2"/><text x="492" y="291" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0c6c85" font-weight="700" text-anchor="middle">Gain medium</text><text x="492" y="322" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#243340" font-weight="400" text-anchor="middle">g , α</text><line x1="260" y1="226" x2="724" y2="226" stroke="#0c6c85" stroke-width="3" marker-end="url(#arr)"/><line x1="724" y1="377" x2="260" y2="377" stroke="#c56b3c" stroke-width="3"/><line x1="760" y1="303" x2="856" y2="303" stroke="#0c6c85" stroke-width="3" marker-end="url(#arr)"/><text x="823" y="266" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#0c6c85" font-weight="400" text-anchor="middle">Output</text><text x="492" y="458" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#243340" font-weight="400" text-anchor="middle">R₁ R₂ exp[2(g − α)L] = 1</text><line x1="220" y1="500" x2="764" y2="500" stroke="#bbc5c9" stroke-width="2"/><text x="492" y="545" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#61707c" font-weight="400" text-anchor="middle">Threshold: round-trip gain = loss</text></svg>