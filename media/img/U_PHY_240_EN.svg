<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Side-by-side passive radiation detection and active radar range measurement with outgoing and returning paths."><title>Passive and Active Remote Sensing</title><desc>Side-by-side passive radiation detection and active radar range measurement with outgoing and returning paths.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287cb5" /></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c77d2d" /></marker></defs><rect x="0" y="0" width="960" height="600" rx="0" fill="#f7f9fd" /><text x="40" y="48" fill="#1c334f" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" text-anchor="start" font-weight="700">Passive and Active Remote Sensing</text><rect x="25" y="76" width="910" height="475" rx="16" fill="#ffffff" stroke="#d3deeb" /><line x1="479" y1="95" x2="479" y2="534" stroke="#d3deeb" stroke-width="2" /><text x="65" y="119" fill="#1c334f" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" text-anchor="start" font-weight="700">Passive Reception</text><text x="508" y="119" fill="#1c334f" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" text-anchor="start" font-weight="700">Active Pulse and Echo</text><rect x="177" y="380" width="140" height="48" rx="6" fill="#d7e5da" /><text x="247" y="410" fill="#1c334f" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="middle" font-weight="400">Surface</text><rect x="181" y="180" width="132" height="64" rx="8" fill="#dceafa" /><text x="247" y="218" fill="#1c334f" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" text-anchor="middle" font-weight="700">Sensor</text><rect x="635" y="380" width="140" height="48" rx="6" fill="#d7e5da" /><text x="705" y="410" fill="#1c334f" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" text-anchor="middle" font-weight="400">Surface</text><rect x="639" y="180" width="132" height="64" rx="8" fill="#dceafa" /><text x="705" y="218" fill="#1c334f" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" text-anchor="middle" font-weight="700">Sensor</text><circle cx="117" cy="192" r="25" fill="#c77d2d" /><line x1="130" y1="220" x2="207" y2="371" stroke="#c77d2d" stroke-width="4" marker-end="url(#arrow-orange)" /><text x="101" y="284" fill="#c77d2d" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" text-anchor="start" font-weight="400">Sun</text><line x1="275" y1="372" x2="275" y2="256" stroke="#287cb5" stroke-width="4" marker-end="url(#arrow)" /><text x="291" y="311" fill="#287cb5" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" text-anchor="start" font-weight="400">existing radiation</text><path d="M 665 252 L 665 370" stroke="#c77d2d" stroke-width="4" fill="none" marker-end="url(#arrow-orange)" stroke-linecap="round" stroke-linejoin="round" /><path d="M 737 374 L 737 254" stroke="#287cb5" stroke-width="4" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" /><text x="635" y="318" fill="#c77d2d" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" text-anchor="end" font-weight="400">Transmit</text><text x="757" y="320" fill="#287cb5" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" text-anchor="start" font-weight="400">Echo</text><text x="706" y="483" fill="#1c334f" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" text-anchor="middle" font-weight="700">Time delay: Δt = 2R/v</text></svg>