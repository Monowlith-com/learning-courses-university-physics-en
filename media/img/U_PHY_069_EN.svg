<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="t d"><title id="t">From base units to derived units</title><desc id="d">Derivation of newton and joule from kilogram, metre and second.</desc><defs><marker id="arrowB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 Z" fill="#17668c"/></marker><marker id="arrowO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 Z" fill="#a64e21"/></marker><marker id="arrowK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 Z" fill="#20262c"/></marker></defs><rect width="960" height="600" fill="#fff"/><text x="42" y="59" font-family="Arial, sans-serif" font-size="32" fill="#20262c" text-anchor="start" font-weight="700">From base units to derived units</text><line x1="42" y1="82" x2="918" y2="82" stroke="#b9c0c7" stroke-width="1"/><rect x="70" y="135" width="230" height="115" rx="8" fill="#fff" stroke="#68727d" stroke-width="2"/><text x="185" y="178" font-family="Arial, sans-serif" font-size="24" fill="#20262c" text-anchor="middle" font-weight="400">Mass</text><text x="185" y="220" font-family="Arial, sans-serif" font-size="30" fill="#17668c" text-anchor="middle" font-weight="700">kg</text><rect x="365" y="135" width="230" height="115" rx="8" fill="#fff" stroke="#68727d" stroke-width="2"/><text x="480" y="178" font-family="Arial, sans-serif" font-size="24" fill="#20262c" text-anchor="middle" font-weight="400">Length</text><text x="480" y="220" font-family="Arial, sans-serif" font-size="30" fill="#17668c" text-anchor="middle" font-weight="700">m</text><rect x="660" y="135" width="230" height="115" rx="8" fill="#fff" stroke="#68727d" stroke-width="2"/><text x="775" y="178" font-family="Arial, sans-serif" font-size="24" fill="#20262c" text-anchor="middle" font-weight="400">Time</text><text x="775" y="220" font-family="Arial, sans-serif" font-size="30" fill="#17668c" text-anchor="middle" font-weight="700">s</text><line x1="185" y1="250" x2="185" y2="286" stroke="#68727d" stroke-width="2"/><line x1="480" y1="250" x2="480" y2="286" stroke="#68727d" stroke-width="2"/><line x1="775" y1="250" x2="775" y2="286" stroke="#68727d" stroke-width="2"/><line x1="185" y1="286" x2="775" y2="286" stroke="#68727d" stroke-width="2"/><line x1="480" y1="286" x2="480" y2="330" stroke="#17668c" stroke-width="3" marker-end="url(#arrowB)"/><rect x="270" y="330" width="420" height="100" rx="8" fill="white" stroke="#17668c" stroke-width="2"/><text x="480" y="368" font-family="Arial, sans-serif" font-size="24" fill="#20262c" text-anchor="middle" font-weight="400">Force</text><text x="480" y="404" font-family="Arial, sans-serif" font-size="30" fill="#17668c" text-anchor="middle" font-weight="700">N = kg · m · s⁻²</text><line x1="480" y1="430" x2="480" y2="472" stroke="#20262c" stroke-width="2" marker-end="url(#arrowK)"/><text x="501" y="463" font-family="Arial, sans-serif" font-size="21" fill="#20262c" text-anchor="start" font-weight="400">× length (m)</text><rect x="270" y="475" width="420" height="95" rx="8" fill="white" stroke="#68727d" stroke-width="2"/><text x="480" y="510" font-family="Arial, sans-serif" font-size="24" fill="#20262c" text-anchor="middle" font-weight="400">Energy</text><text x="480" y="547" font-family="Arial, sans-serif" font-size="26" fill="#17668c" text-anchor="middle" font-weight="700">J = N · m = kg · m² · s⁻²</text></svg>
