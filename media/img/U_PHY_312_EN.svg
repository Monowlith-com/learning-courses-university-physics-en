<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="t d"><title id="t">Displacement as an area</title><desc id="d">Velocity–time graph increasing from 2 to 8 m/s with a trapezoid area.</desc><defs><marker id="arrowB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 Z" fill="#17668c"/></marker><marker id="arrowO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 Z" fill="#a64e21"/></marker><marker id="arrowK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 Z" fill="#20262c"/></marker></defs><rect width="960" height="600" fill="#fff"/><text x="42" y="59" font-family="Arial, sans-serif" font-size="32" fill="#20262c" text-anchor="start" font-weight="700">Displacement as an area</text><line x1="42" y1="82" x2="918" y2="82" stroke="#b9c0c7" stroke-width="1"/><line x1="130" y1="480" x2="820" y2="480" stroke="#20262c" stroke-width="2" marker-end="url(#arrowK)"/><line x1="130" y1="480" x2="130" y2="125" stroke="#20262c" stroke-width="2" marker-end="url(#arrowK)"/><text x="832" y="515" font-family="Arial, sans-serif" font-size="23" fill="#20262c" text-anchor="end" font-weight="400">t (s)</text><text x="142" y="123" font-family="Arial, sans-serif" font-size="23" fill="#20262c" text-anchor="start" font-weight="400">v (m/s)</text><line x1="130" y1="475" x2="130" y2="485" stroke="#20262c" stroke-width="1"/><text x="130" y="510" font-family="Arial, sans-serif" font-size="20" fill="#20262c" text-anchor="middle" font-weight="400">0</text><line x1="325" y1="475" x2="325" y2="485" stroke="#20262c" stroke-width="1"/><text x="325" y="510" font-family="Arial, sans-serif" font-size="20" fill="#20262c" text-anchor="middle" font-weight="400">1</text><line x1="520" y1="475" x2="520" y2="485" stroke="#20262c" stroke-width="1"/><text x="520" y="510" font-family="Arial, sans-serif" font-size="20" fill="#20262c" text-anchor="middle" font-weight="400">2</text><line x1="715" y1="475" x2="715" y2="485" stroke="#20262c" stroke-width="1"/><text x="715" y="510" font-family="Arial, sans-serif" font-size="20" fill="#20262c" text-anchor="middle" font-weight="400">3</text><line x1="125" y1="408" x2="135" y2="408" stroke="#20262c" stroke-width="1"/><text x="116" y="415" font-family="Arial, sans-serif" font-size="20" fill="#20262c" text-anchor="end" font-weight="400">2</text><line x1="125" y1="336" x2="135" y2="336" stroke="#20262c" stroke-width="1"/><text x="116" y="343" font-family="Arial, sans-serif" font-size="20" fill="#20262c" text-anchor="end" font-weight="400">4</text><line x1="125" y1="264" x2="135" y2="264" stroke="#20262c" stroke-width="1"/><text x="116" y="271" font-family="Arial, sans-serif" font-size="20" fill="#20262c" text-anchor="end" font-weight="400">6</text><line x1="125" y1="192" x2="135" y2="192" stroke="#20262c" stroke-width="1"/><text x="116" y="199" font-family="Arial, sans-serif" font-size="20" fill="#20262c" text-anchor="end" font-weight="400">8</text><polygon points="130,480 130,408 715,192 715,480" fill="#e6edf0" stroke="none" stroke-width="2"/><line x1="130" y1="408" x2="715" y2="192" stroke="#17668c" stroke-width="4"/><line x1="715" y1="192" x2="715" y2="480" stroke="#68727d" stroke-width="2" stroke-dasharray="7 6"/><text x="430" y="390" font-family="Arial, sans-serif" font-size="32" fill="#17668c" text-anchor="middle" font-weight="700">Δx = 15 m</text><text x="470" y="236" font-family="Arial, sans-serif" font-size="25" fill="#17668c" text-anchor="middle" font-weight="400">a = 2 m/s²</text><text x="470" y="554" font-family="Arial, sans-serif" font-size="24" fill="#20262c" text-anchor="middle" font-weight="400">Area: (2 + 8) × 3 / 2 = 15 m</text></svg>
