<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Polarization in the plane of incidence and ideal analyser axes"><title>Polarization and Analyser</title><desc>Field direction and intensity must be distinguished.</desc><defs><marker id="arr" viewBox="0 0 10 8" markerWidth="9" markerHeight="7" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#0c6c85"/></marker></defs><rect x="0" y="0" width="960" height="600" rx="1" fill="white" stroke="white" stroke-width="0"/><text x="43" y="50" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#243340" font-weight="700" text-anchor="start">Polarization and Analyser</text><text x="43" y="83" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#61707c" font-weight="400" text-anchor="start">Field direction and intensity must be distinguished.</text><line x1="43" y1="105" x2="917" y2="105" stroke="#bbc5c9" stroke-width="1"/><text x="259" y="157" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#243340" font-weight="700" text-anchor="middle">Interface</text><line x1="110" y1="373" x2="474" y2="373" stroke="#243340" stroke-width="3"/><line x1="282" y1="190" x2="282" y2="535" stroke="#bbc5c9" stroke-width="2" stroke-dasharray="6 7"/><line x1="145" y1="230" x2="282" y2="373" stroke="#0c6c85" stroke-width="4" marker-end="url(#arr)"/><line x1="282" y1="373" x2="418" y2="230" stroke="#c56b3c" stroke-width="4"/><line x1="282" y1="373" x2="397" y2="509" stroke="#0c6c85" stroke-width="4" marker-end="url(#arr)"/><text x="128" y="491" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#243340" font-weight="400" text-anchor="start">s</text><text x="349" y="295" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#243340" font-weight="400" text-anchor="start">p</text><text x="259" y="550" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#61707c" font-weight="400" text-anchor="middle">incidence plane</text><line x1="505" y1="160" x2="505" y2="518" stroke="#bbc5c9" stroke-width="1"/><text x="712" y="157" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#243340" font-weight="700" text-anchor="middle">Linear analyser</text><circle cx="698" cy="355" r="132" stroke="#0c6c85" stroke-width="2" fill="#fbfbfb"/><line x1="603" y1="450" x2="792" y2="260" stroke="#0c6c85" stroke-width="4"/><line x1="698" y1="229" x2="698" y2="482" stroke="#bbc5c9" stroke-width="2" stroke-dasharray="5 6"/><text x="732" y="342" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#c56b3c" font-weight="400" text-anchor="start">φ</text><text x="700" y="518" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#243340" font-weight="400" text-anchor="middle">I / I₀ = cos² φ</text></svg>