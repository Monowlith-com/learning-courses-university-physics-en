<text x="667.0" y="223.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" text-anchor="start" font-weight="700" fill="#086d92">Electric</text>
<text x="667.0" y="264.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" text-anchor="start" font-weight="400" fill="#086d92">F⁰ⁱ = Eᵢ/c</text>
<text x="667.0" y="327.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" text-anchor="start" font-weight="700" fill="#b96232">Magnetic</text>
<text x="667.0" y="369.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" font-weight="400" fill="#b96232">Fⁱʲ = εⁱʲᵏ Bₖ</text>
<text x="480.0" y="527.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" text-anchor="middle" font-weight="400" fill="#1d3346">F^(μν) = −F^(νμ)</text>
<text x="480.0" y="561.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" text-anchor="middle" font-weight="400" fill="#1d3346">F^(μν) F_(μν) = 2(B² − E²/c²)</text>
