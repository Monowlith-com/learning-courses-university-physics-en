<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Four by four electromagnetic field tensor matrix showing electric and magnetic entries">
<title>Antisymmetric Electromagnetic Field Tensor</title>
<desc>Six independent components, paired with opposite sign.</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" viewBox="0 0 8 8"><path d="M0 0 L8 4 L0 8 Z" fill="#086d92"/></marker></defs>
