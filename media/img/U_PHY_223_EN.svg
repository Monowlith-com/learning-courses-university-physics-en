<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Four boxes for internal energy, enthalpy, Helmholtz and Gibbs energy with transformation arrows"><title>Four Thermodynamic Potentials</title><desc>Natural variables and Legendre transforms</desc><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#176a8e"/></marker></defs><rect x="0.0" y="0.0" width="960.0" height="600.0" rx="0" fill="#fff" stroke="#fff" stroke-width="0"/><text x="40.0" y="54.0" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#26343f" text-anchor="start" font-weight="700">Four Thermodynamic Potentials</text><text x="40.0" y="87.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#65727d" text-anchor="start" font-weight="400">Natural variables and Legendre transforms</text><line x1="40.0" y1="108.0" x2="920.0" y2="108.0" stroke="#c4cbd0" stroke-width="1"/><rect x="75.0" y="170.0" width="320.0" height="119.0" rx="4" fill="#fff" stroke="#26343f" stroke-width="2"/><text x="235.0" y="208.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#176a8e" text-anchor="middle" font-weight="700">U(S,V)</text><text x="235.0" y="240.0" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#26343f" text-anchor="middle" font-weight="400">Internal energy</text><text x="235.0" y="270.0" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#26343f" text-anchor="middle" font-weight="400">dU = T dS − p dV</text><rect x="560.0" y="170.0" width="320.0" height="119.0" rx="4" fill="#fff" stroke="#26343f" stroke-width="2"/><text x="720.0" y="208.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#176a8e" text-anchor="middle" font-weight="700">H(S,p)</text><text x="720.0" y="240.0" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#26343f" text-anchor="middle" font-weight="400">Enthalpy</text><text x="720.0" y="270.0" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#26343f" text-anchor="middle" font-weight="400">dH = T dS + V dp</text><rect x="75.0" y="407.0" width="320.0" height="119.0" rx="4" fill="#fff" stroke="#26343f" stroke-width="2"/><text x="235.0" y="445.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#176a8e" text-anchor="middle" font-weight="700">F(T,V)</text><text x="235.0" y="477.0" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#26343f" text-anchor="middle" font-weight="400">Helmholtz energy</text><text x="235.0" y="507.0" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#26343f" text-anchor="middle" font-weight="400">dF = −S dT − p dV</text><rect x="560.0" y="407.0" width="320.0" height="119.0" rx="4" fill="#fff" stroke="#26343f" stroke-width="2"/><text x="720.0" y="445.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#176a8e" text-anchor="middle" font-weight="700">G(T,p)</text><text x="720.0" y="477.0" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#26343f" text-anchor="middle" font-weight="400">Gibbs energy</text><text x="720.0" y="507.0" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#26343f" text-anchor="middle" font-weight="400">dG = −S dT + V dp</text><line x1="403.0" y1="224.0" x2="550.0" y2="224.0" stroke="#176a8e" stroke-width="3" marker-end="url(#arr)"/><text x="476.0" y="204.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#26343f" text-anchor="middle" font-weight="400">+ pV</text><line x1="403.0" y1="460.0" x2="550.0" y2="460.0" stroke="#176a8e" stroke-width="3" marker-end="url(#arr)"/><text x="476.0" y="440.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#26343f" text-anchor="middle" font-weight="400">+ pV</text><line x1="236.0" y1="300.0" x2="236.0" y2="394.0" stroke="#176a8e" stroke-width="3" marker-end="url(#arr)"/><text x="284.0" y="355.0" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#26343f" text-anchor="start" font-weight="400">− TS</text><line x1="723.0" y1="300.0" x2="723.0" y2="394.0" stroke="#176a8e" stroke-width="3" marker-end="url(#arr)"/><text x="771.0" y="355.0" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#26343f" text-anchor="start" font-weight="400">− TS</text></svg>