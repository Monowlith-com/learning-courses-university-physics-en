<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Two positive charges on an axis with field vectors and cancellation at midpoint"><title>Fields of Two Positive Point Charges</title><desc>Superposition at the midpoint and to the right</desc><defs><marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#126885"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="white" stroke="white" stroke-width="0" rx="4"/><text x="42" y="54" fill="#26343f" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start">Fields of Two Positive Point Charges</text><text x="42" y="87" fill="#65727d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Superposition at the midpoint and to the right</text><line x1="42" y1="109" x2="918" y2="109" stroke="#c8cfd2" stroke-width="1"/><line x1="102" y1="348" x2="865" y2="348" stroke="#c8cfd2" stroke-width="2"/><circle cx="266" cy="348" r="31" fill="white" stroke="#ba5449" stroke-width="4"/><circle cx="560" cy="348" r="31" fill="white" stroke="#ba5449" stroke-width="4"/><text x="266" y="357" fill="#ba5449" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">+Q</text><text x="560" y="357" fill="#ba5449" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">+Q</text><line x1="398" y1="309" x2="337" y2="309" stroke="#126885" stroke-width="3" marker-end="url(#arrow)"/><line x1="429" y1="387" x2="492" y2="387" stroke="#126885" stroke-width="3" marker-end="url(#arrow)"/><circle cx="413" cy="348" r="7" fill="#26343f" stroke="#26343f" stroke-width="2"/><text x="415" y="252" fill="#26343f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Midpoint: E = 0</text><line x1="413" y1="262" x2="413" y2="332" stroke="#c8cfd2" stroke-width="2" stroke-dasharray="4 5"/><circle cx="763" cy="348" r="7" fill="#26343f" stroke="#26343f" stroke-width="2"/><line x1="622" y1="310" x2="729" y2="310" stroke="#126885" stroke-width="3" marker-end="url(#arrow)"/><line x1="624" y1="388" x2="858" y2="388" stroke="#126885" stroke-width="3" marker-end="url(#arrow)"/><text x="746" y="255" fill="#26343f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">Observation point</text><text x="746" y="473" fill="#126885" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Fields add</text><text x="417" y="540" fill="#26343f" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" text-anchor="middle">E(x) = E₁(x) + E₂(x)</text></svg>