<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Rays at an optical interface showing incidence, reflection and refraction"><title>Reflection and Refraction</title><desc>Angles are measured from the surface normal.</desc><defs><marker id="arr" viewBox="0 0 10 8" markerWidth="9" markerHeight="7" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#0c6c85"/></marker></defs><rect x="0" y="0" width="960" height="600" rx="1" fill="white" stroke="white" stroke-width="0"/><text x="43" y="50" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#243340" font-weight="700" text-anchor="start">Reflection and Refraction</text><text x="43" y="83" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#61707c" font-weight="400" text-anchor="start">Angles are measured from the surface normal.</text><line x1="43" y1="105" x2="917" y2="105" stroke="#bbc5c9" stroke-width="1"/><rect x="100" y="322" width="760" height="195" rx="1" fill="#fbfbfb" stroke="#0c6c85" stroke-width="1"/><line x1="100" y1="322" x2="860" y2="322" stroke="#243340" stroke-width="3"/><line x1="462" y1="145" x2="462" y2="506" stroke="#bbc5c9" stroke-width="2" stroke-dasharray="6 7"/><line x1="359" y1="144" x2="462" y2="322" stroke="#0c6c85" stroke-width="4" marker-end="url(#arr)"/><line x1="462" y1="322" x2="565" y2="144" stroke="#c56b3c" stroke-width="4"/><line x1="462" y1="322" x2="527" y2="515" stroke="#0c6c85" stroke-width="4" marker-end="url(#arr)"/><text x="128" y="163" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#243340" font-weight="400" text-anchor="start">n₁ = 1.00</text><text x="128" y="473" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#243340" font-weight="400" text-anchor="start">n₂ = 1.50</text><text x="363" y="240" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#0c6c85" font-weight="400" text-anchor="start">θ₁ = 30°</text><text x="508" y="408" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#0c6c85" font-weight="400" text-anchor="start">θ₂ ≈ 19.5°</text><text x="554" y="219" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#c56b3c" font-weight="400" text-anchor="start">reflected</text><text x="460" y="560" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#61707c" font-weight="400" text-anchor="middle">normal</text></svg>