<rect x="0" y="0" width="960" height="600" rx="0" fill="white" stroke="white"/>
<text x="40.0" y="46.0" fill="#12314f" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">Coupling Two Spin-½ Systems</text>
<text x="40.0" y="76.0" fill="#61758a" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Four product states become a triplet and a singlet.</text>
<line x1="40.0" y1="98.0" x2="920.0" y2="98.0" stroke="#d8e3eb" stroke-width="1" />
