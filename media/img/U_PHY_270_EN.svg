<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Coupling scheme of four product basis states into three triplet states and one singlet state">
<title>Coupling Two Spin-½ Systems</title>
