<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Cross-sectional Gaussian sphere around positive charge with radial electric field arrows"><title>Gaussian Surface and Radial Field</title><desc>Closed spherical surface and outward normals</desc><defs><marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#126885"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="white" stroke="white" stroke-width="0" rx="4"/><text x="42" y="54" fill="#26343f" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start">Gaussian Surface and Radial Field</text><text x="42" y="87" fill="#65727d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Closed spherical surface and outward normals</text><line x1="42" y1="109" x2="918" y2="109" stroke="#c8cfd2" stroke-width="1"/><circle cx="320" cy="340" r="171" fill="white" stroke="#126885" stroke-width="3"/><circle cx="320" cy="340" r="28" fill="white" stroke="#ba5449" stroke-width="3"/><text x="320" y="348" fill="#ba5449" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">+Q</text><line x1="405.0" y1="340.0" x2="535.0" y2="340.0" stroke="#126885" stroke-width="3" marker-end="url(#arrow)"/><line x1="380.1" y1="400.1" x2="472.0" y2="492.0" stroke="#126885" stroke-width="3" marker-end="url(#arrow)"/><line x1="320.0" y1="425.0" x2="320.0" y2="555.0" stroke="#126885" stroke-width="3" marker-end="url(#arrow)"/><line x1="259.9" y1="400.1" x2="168.0" y2="492.0" stroke="#126885" stroke-width="3" marker-end="url(#arrow)"/><line x1="235.0" y1="340.0" x2="105.0" y2="340.0" stroke="#126885" stroke-width="3" marker-end="url(#arrow)"/><line x1="259.9" y1="279.9" x2="168.0" y2="188.0" stroke="#126885" stroke-width="3" marker-end="url(#arrow)"/><line x1="320.0" y1="255.0" x2="320.0" y2="125.0" stroke="#126885" stroke-width="3" marker-end="url(#arrow)"/><line x1="380.1" y1="279.9" x2="472.0" y2="188.0" stroke="#126885" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="555" fill="#26343f" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">closed Gaussian surface</text><rect x="612" y="219" width="266" height="205" fill="white" stroke="#c8cfd2" stroke-width="2" rx="4"/><text x="744" y="268" fill="#126885" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="middle">ΦE = Q / ε₀</text><text x="744" y="311" fill="#26343f" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">outward-oriented</text><text x="744" y="348" fill="#ba5449" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="middle">E(r) = k Q/r²</text><text x="744" y="388" fill="#26343f" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">spherical symmetry</text></svg>