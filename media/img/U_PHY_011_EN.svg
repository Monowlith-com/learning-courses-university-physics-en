<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Energy-level diagrams for a hydrogen transition from three to two and mercury excitation near 4.9 electronvolts">
<title>Discrete Atomic Excitation</title>
<desc>Hydrogen spectral lines and excitation by electron collisions in mercury.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#086d92"/></marker></defs>
<rect x="0" y="0" width="960" height="600" fill="#fff" stroke="#fff" stroke-width="0" rx="0"/>
<text x="42.0" y="47.0" fill="#142b3e" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="26" text-anchor="start">Discrete Atomic Excitation</text>
<text x="42.0" y="79.0" fill="#627786" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" font-size="16" text-anchor="start">Hydrogen spectral lines and excitation by electron collisions in mercury.</text>
<line x1="42.0" y1="106.0" x2="918.0" y2="106.0" stroke="#dce5e8" stroke-width="1"/>
<line x1="493.0" y1="145.0" x2="493.0" y2="526.0" stroke="#dce5e8" stroke-width="2"/>
<text x="89.0" y="157.0" fill="#142b3e" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="20" text-anchor="start">Hydrogen</text>
<text x="533.0" y="157.0" fill="#142b3e" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="20" text-anchor="start">Mercury, collision</text>
<line x1="93.0" y1="450.0" x2="420.0" y2="450.0" stroke="#1d3346" stroke-width="3"/>
<text x="98.0" y="438.0" fill="#1d3346" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" font-size="16" text-anchor="start">n = 1, −13.6 eV</text>
<line x1="93.0" y1="311.0" x2="420.0" y2="311.0" stroke="#1d3346" stroke-width="3"/>
<text x="98.0" y="299.0" fill="#1d3346" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" font-size="16" text-anchor="start">n = 2, −3.40 eV</text>
<line x1="93.0" y1="250.0" x2="420.0" y2="250.0" stroke="#1d3346" stroke-width="3"/>
<text x="98.0" y="238.0" fill="#1d3346" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" font-size="16" text-anchor="start">n = 3, −1.51 eV</text>
<line x1="360.0" y1="259.0" x2="360.0" y2="295.0" stroke="#086d92" stroke-width="4" marker-end="url(#arrow)"/>
<text x="385.0" y="294.0" fill="#086d92" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" font-size="17" text-anchor="start">656 nm</text>
<line x1="560.0" y1="438.0" x2="840.0" y2="438.0" stroke="#1d3346" stroke-width="3"/>
<text x="560.0" y="459.0" fill="#1d3346" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" font-size="16" text-anchor="start">Ground state</text>
<line x1="560.0" y1="250.0" x2="840.0" y2="250.0" stroke="#1d3346" stroke-width="3"/>
<text x="560.0" y="236.0" fill="#1d3346" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" font-size="16" text-anchor="start">Excited</text>
<line x1="759.0" y1="428.0" x2="759.0" y2="262.0" stroke="#b96232" stroke-width="4" marker-end="url(#arrow)"/>
<text x="782.0" y="344.0" fill="#b96232" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" font-size="20" text-anchor="start">4.9 eV</text>
<text x="480.0" y="540.0" fill="#1d3346" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" font-size="18" text-anchor="middle">Photon transition / collision excitation</text>
</svg>
