<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Two bodies at different temperatures in contact with a heat-transfer arrow"><title>Two Bodies in Thermal Contact</title><desc>Energy exchange towards a common final state</desc><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#176a8e"/></marker></defs><rect x="0.0" y="0.0" width="960.0" height="600.0" rx="0" fill="#fff" stroke="#fff" stroke-width="0"/><text x="40.0" y="54.0" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#26343f" text-anchor="start" font-weight="700">Two Bodies in Thermal Contact</text><text x="40.0" y="87.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#65727d" text-anchor="start" font-weight="400">Energy exchange towards a common final state</text><line x1="40.0" y1="108.0" x2="920.0" y2="108.0" stroke="#c4cbd0" stroke-width="1"/><text x="245.0" y="157.0" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#26343f" text-anchor="middle" font-weight="700">Before contact</text><text x="714.0" y="157.0" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#26343f" text-anchor="middle" font-weight="700">At equilibrium</text><rect x="92.0" y="230.0" width="135.0" height="184.0" rx="4" fill="#fff" stroke="#26343f" stroke-width="3"/><rect x="262.0" y="230.0" width="135.0" height="184.0" rx="4" fill="#fff" stroke="#26343f" stroke-width="3"/><text x="159.0" y="323.0" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#ae5245" text-anchor="middle" font-weight="400">T₁</text><text x="329.0" y="323.0" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#176a8e" text-anchor="middle" font-weight="400">T₂</text><line x1="242.0" y1="304.0" x2="242.0" y2="357.0" stroke="#c4cbd0" stroke-width="2"/><rect x="560.0" y="230.0" width="135.0" height="184.0" rx="4" fill="#fff" stroke="#26343f" stroke-width="3"/><rect x="730.0" y="230.0" width="135.0" height="184.0" rx="4" fill="#fff" stroke="#26343f" stroke-width="3"/><text x="627.0" y="323.0" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#26343f" text-anchor="middle" font-weight="400">Tₑ</text><text x="797.0" y="323.0" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#26343f" text-anchor="middle" font-weight="400">Tₑ</text><line x1="710.0" y1="304.0" x2="710.0" y2="357.0" stroke="#c4cbd0" stroke-width="2"/><line x1="228.0" y1="320.0" x2="260.0" y2="320.0" stroke="#176a8e" stroke-width="3" marker-end="url(#arr)"/><text x="244.0" y="291.0" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#176a8e" text-anchor="middle" font-weight="400">Q</text><line x1="416.0" y1="328.0" x2="540.0" y2="328.0" stroke="#176a8e" stroke-width="3" marker-end="url(#arr)"/><text x="477.0" y="307.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#26343f" text-anchor="middle" font-weight="400">time</text><text x="245.0" y="467.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#26343f" text-anchor="middle" font-weight="400">T₁ &gt; T₂</text><text x="715.0" y="467.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#26343f" text-anchor="middle" font-weight="400">T₁ = T₂ = Tₑ</text><text x="480.0" y="548.0" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#65727d" text-anchor="middle" font-weight="400">The final temperature depends on heat capacities.</text></svg>