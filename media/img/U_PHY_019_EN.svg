<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-label="Four Brillouin-zone patches each carry pi over two of Berry flux; their sum gives C equal to one."><title>Berry Curvature, Gauge Convention and Chern Number</title><rect x="0" y="0" width="860" height="470" rx="0" fill="white" stroke="white" stroke-width="1.6"/><text x="42.0" y="57.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#263545" text-anchor="start" font-weight="bold">Berry Curvature, Gauge Convention and Chern Number</text><line x1="42.00" y1="82.00" x2="818.00" y2="82.00" stroke="#cad4df" stroke-width="1.5" /><rect x="239" y="137" width="193" height="110" rx="2" fill="#eaf4f8" stroke="#1c6f9d" stroke-width="1.6"/><text x="336.0" y="185.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#1c6f9d" text-anchor="middle" font-weight="normal">π/2</text><text x="336.0" y="215.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#607485" text-anchor="middle" font-weight="normal">Φ</text><rect x="444" y="137" width="193" height="110" rx="2" fill="#f8fbfd" stroke="#1c6f9d" stroke-width="1.6"/><text x="541.0" y="185.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#1c6f9d" text-anchor="middle" font-weight="normal">π/2</text><text x="541.0" y="215.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#607485" text-anchor="middle" font-weight="normal">Φ</text><rect x="239" y="260" width="193" height="110" rx="2" fill="#f8fbfd" stroke="#1c6f9d" stroke-width="1.6"/><text x="336.0" y="308.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#1c6f9d" text-anchor="middle" font-weight="normal">π/2</text><text x="336.0" y="338.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#607485" text-anchor="middle" font-weight="normal">Φ</text><rect x="444" y="260" width="193" height="110" rx="2" fill="#eaf4f8" stroke="#1c6f9d" stroke-width="1.6"/><text x="541.0" y="308.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#1c6f9d" text-anchor="middle" font-weight="normal">π/2</text><text x="541.0" y="338.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#607485" text-anchor="middle" font-weight="normal">Φ</text><text x="430.0" y="417.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#218475" text-anchor="middle" font-weight="normal">Φ_total = 2π  ⇒  C = 1</text></svg>
