<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Bar chart showing total 180, background 40, estimated net 140">
<title>Background subtraction</title>
<desc>Independent counts with equal exposure</desc>
<rect x="0" y="0" width="960" height="600" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="34.0" y="49.0" text-anchor="start" font-size="26" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" fill="#1d3551">Background subtraction</text>
<text x="34.0" y="82.0" text-anchor="start" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400" fill="#627888">Independent counts with equal exposure</text>
<line x1="34.0" y1="101.0" x2="925.0" y2="101.0" stroke="#bacbd5" stroke-width="1"/>
<rect x="180" y="220.5" width="140" height="274.5" rx="0" fill="#2777a8" stroke="#2777a8" stroke-width="2"/>
<text x="250.0" y="530.0" text-anchor="middle" font-size="18" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400" fill="#1d3551">Total</text>
<text x="250.0" y="201.5" text-anchor="middle" font-size="25" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" fill="#1d3551">180</text>
<rect x="440" y="434.0" width="140" height="61.0" rx="0" fill="#c46b32" stroke="#c46b32" stroke-width="2"/>
<text x="510.0" y="530.0" text-anchor="middle" font-size="18" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400" fill="#1d3551">Background</text>
<text x="510.0" y="415.0" text-anchor="middle" font-size="25" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" fill="#1d3551">40</text>
<rect x="700" y="281.5" width="140" height="213.5" rx="0" fill="#237b64" stroke="#237b64" stroke-width="2"/>
<text x="770.0" y="530.0" text-anchor="middle" font-size="18" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400" fill="#1d3551">Net</text>
<text x="770.0" y="262.5" text-anchor="middle" font-size="25" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" fill="#1d3551">140</text>
<line x1="101.0" y1="495.0" x2="865.0" y2="495.0" stroke="#1d3551" stroke-width="2"/>
<text x="486.0" y="578.0" text-anchor="middle" font-size="20" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400" fill="#1d3551">Net = 180 − 40 = 140;  u ≈ √220 = 14.8</text>
</svg>