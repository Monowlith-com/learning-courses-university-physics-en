<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Global radiation budget showing 340 incoming, 102 reflected and 238 outgoing watts per square metre."><title>Planetary Radiation Budget</title><desc>Global radiation budget showing 340 incoming, 102 reflected and 238 outgoing watts per square metre.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287cb5" /></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c77d2d" /></marker></defs><rect x="0" y="0" width="960" height="600" rx="0" fill="#f7f9fd" /><text x="40" y="48" fill="#1c334f" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" text-anchor="start" font-weight="700">Planetary Radiation Budget</text><rect x="25" y="76" width="910" height="475" rx="16" fill="#ffffff" stroke="#d3deeb" /><text x="67" y="121" fill="#1c334f" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" text-anchor="start" font-weight="700">Global Mean at Top of Atmosphere</text><rect x="76" y="380" width="812" height="92" rx="10" fill="#dfeae6" /><text x="483" y="424" fill="#1c334f" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" text-anchor="middle" font-weight="700">Earth + Atmosphere</text><line x1="76" y1="382" x2="888" y2="382" stroke="#287cb5" stroke-width="3" stroke-dasharray="6 4" /><text x="483" y="371" fill="#1c334f" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" text-anchor="middle" font-weight="400">Top of Atmosphere</text><line x1="214" y1="178" x2="214" y2="340" stroke="#c77d2d" stroke-width="13" marker-end="url(#arrow-orange)" /><text x="217" y="148" fill="#c77d2d" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" text-anchor="middle" font-weight="700">340 W/m²</text><line x1="404" y1="342" x2="404" y2="194" stroke="#287cb5" stroke-width="8" marker-end="url(#arrow)" /><text x="412" y="161" fill="#287cb5" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" text-anchor="middle" font-weight="700">102 W/m²</text><line x1="720" y1="342" x2="720" y2="194" stroke="#c4505c" stroke-width="13" /><path d="M 720 335 L 720 197" stroke="#c4505c" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 699 218 L 720 182 L 741 218" stroke="#c4505c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="723" y="159" fill="#c4505c" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" text-anchor="middle" font-weight="700">238 W/m²</text><text x="212" y="509" fill="#1c334f" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" text-anchor="middle" font-weight="400">Solar input</text><text x="410" y="509" fill="#1c334f" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" text-anchor="middle" font-weight="400">Reflected</text><text x="716" y="509" fill="#1c334f" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" text-anchor="middle" font-weight="400">Thermal emission</text></svg>