<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Michelson setup with a beamsplitter and two arms"><title>Michelson Interferometer</title><desc>Mirror displacement changes the round-trip path by twice as much.</desc><defs><marker id="arr" viewBox="0 0 10 8" markerWidth="9" markerHeight="7" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#0c6c85"/></marker></defs><rect x="0" y="0" width="960" height="600" rx="1" fill="white" stroke="white" stroke-width="0"/><text x="43" y="50" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#243340" font-weight="700" text-anchor="start">Michelson Interferometer</text><text x="43" y="83" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#61707c" font-weight="400" text-anchor="start">Mirror displacement changes the round-trip path by twice as much.</text><line x1="43" y1="105" x2="917" y2="105" stroke="#bbc5c9" stroke-width="1"/><text x="138" y="280" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#243340" font-weight="700" text-anchor="start">Source</text><line x1="183" y1="307" x2="440" y2="307" stroke="#0c6c85" stroke-width="4" marker-end="url(#arr)"/><line x1="430" y1="317" x2="450" y2="297" stroke="#243340" stroke-width="5"/><line x1="440" y1="307" x2="727" y2="307" stroke="#0c6c85" stroke-width="3" marker-end="url(#arr)"/><line x1="440" y1="307" x2="440" y2="159" stroke="#0c6c85" stroke-width="3" marker-end="url(#arr)"/><line x1="439" y1="307" x2="439" y2="494" stroke="#c56b3c" stroke-width="3" marker-end="url(#arr)"/><line x1="726" y1="228" x2="726" y2="387" stroke="#243340" stroke-width="6"/><line x1="373" y1="160" x2="507" y2="160" stroke="#243340" stroke-width="6"/><text x="749" y="400" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#243340" font-weight="400" text-anchor="start">mirror</text><text x="509" y="156" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#243340" font-weight="400" text-anchor="start">mirror</text><text x="460" y="450" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#c56b3c" font-weight="400" text-anchor="start">detector</text><circle cx="440" cy="502" r="24" stroke="#c56b3c" stroke-width="3" fill="white"/><text x="533" y="282" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#243340" font-weight="400" text-anchor="start">beamsplitter</text><text x="609" y="195" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#0c6c85" font-weight="400" text-anchor="start">Arm A</text><text x="323" y="225" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#0c6c85" font-weight="400" text-anchor="start">Arm B</text><text x="622" y="549" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#243340" font-weight="400" text-anchor="middle">Δℓ = 2 Δx</text></svg>