<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="t d"><title id="t">Mass of air in a lecture hall</title><desc id="d">Cuboidal lecture hall with three dimensions and modelled air mass.</desc><defs><marker id="arrowB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 Z" fill="#17668c"/></marker><marker id="arrowO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 Z" fill="#a64e21"/></marker><marker id="arrowK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 Z" fill="#20262c"/></marker></defs><rect width="960" height="600" fill="#fff"/><text x="42" y="59" font-family="Arial, sans-serif" font-size="32" fill="#20262c" text-anchor="start" font-weight="700">Mass of air in a lecture hall</text><line x1="42" y1="82" x2="918" y2="82" stroke="#b9c0c7" stroke-width="1"/><polygon points="90,270 420,270 565,165 235,165" fill="#f3f6f7" stroke="#68727d" stroke-width="2"/><polygon points="420,270 565,165 565,390 420,495" fill="#e6edf0" stroke="#68727d" stroke-width="2"/><polygon points="90,270 420,270 420,495 90,495" fill="white" stroke="#68727d" stroke-width="2"/><line x1="90" y1="518" x2="420" y2="518" stroke="#20262c" stroke-width="2"/><text x="255" y="551" font-family="Arial, sans-serif" font-size="24" fill="#20262c" text-anchor="middle" font-weight="400">15 m</text><line x1="435" y1="514" x2="580" y2="409" stroke="#20262c" stroke-width="2"/><text x="526" y="493" font-family="Arial, sans-serif" font-size="24" fill="#20262c" text-anchor="middle" font-weight="400">12 m</text><line x1="63" y1="270" x2="63" y2="495" stroke="#20262c" stroke-width="2"/><text x="54" y="387" font-family="Arial, sans-serif" font-size="22" fill="#20262c" text-anchor="end" font-weight="400">4 m</text><text x="255" y="380" font-family="Arial, sans-serif" font-size="26" fill="#17668c" text-anchor="middle" font-weight="700">Air</text><text x="615" y="170" font-family="Arial, sans-serif" font-size="24" fill="#20262c" text-anchor="start" font-weight="700">Model assumptions</text><text x="615" y="220" font-family="Arial, sans-serif" font-size="23" fill="#20262c" text-anchor="start" font-weight="400">V = 15 × 12 × 4 m³</text><text x="615" y="260" font-family="Arial, sans-serif" font-size="26" fill="#17668c" text-anchor="start" font-weight="400">V = 720 m³</text><text x="615" y="315" font-family="Arial, sans-serif" font-size="24" fill="#20262c" text-anchor="start" font-weight="400">ρ = 1.2 kg/m³</text><text x="615" y="365" font-family="Arial, sans-serif" font-size="24" fill="#20262c" text-anchor="start" font-weight="400">m = ρV</text><text x="615" y="412" font-family="Arial, sans-serif" font-size="30" fill="#17668c" text-anchor="start" font-weight="700">m = 864 kg</text><text x="615" y="464" font-family="Arial, sans-serif" font-size="23" fill="#20262c" text-anchor="start" font-weight="400">≈ 900 kg (estimate)</text></svg>
