<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Schematic pressure-temperature phase map for water with a negatively sloped melting curve"><title>Schematic Phase Diagram of Water</title><desc>Coexistence curves with triple and critical points</desc><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#176a8e"/></marker></defs><rect x="0.0" y="0.0" width="960.0" height="600.0" rx="0" fill="#fff" stroke="#fff" stroke-width="0"/><text x="40.0" y="54.0" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#26343f" text-anchor="start" font-weight="700">Schematic Phase Diagram of Water</text><text x="40.0" y="87.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#65727d" text-anchor="start" font-weight="400">Coexistence curves with triple and critical points</text><line x1="40.0" y1="108.0" x2="920.0" y2="108.0" stroke="#c4cbd0" stroke-width="1"/><line x1="149.0" y1="529.0" x2="866.0" y2="529.0" stroke="#176a8e" stroke-width="3" marker-end="url(#arr)"/><line x1="149.0" y1="529.0" x2="149.0" y2="158.0" stroke="#176a8e" stroke-width="3" marker-end="url(#arr)"/><text x="881.0" y="557.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#26343f" text-anchor="start" font-weight="400">T</text><text x="101.0" y="173.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#26343f" text-anchor="start" font-weight="400">p</text><path d="M209 501 Q303 463 420 397" stroke="#176a8e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M420 397 Q565 375 735 227" stroke="#ae5245" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M420 397 Q399 312 354 183" stroke="#3d7656" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="420.0" cy="397.0" r="7.0" fill="#26343f" stroke="#26343f" stroke-width="2"/><circle cx="735.0" cy="227.0" r="7.0" fill="#26343f" stroke="#26343f" stroke-width="2"/><text x="433.0" y="429.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#26343f" text-anchor="start" font-weight="400">Triple point</text><text x="749.0" y="216.0" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#26343f" text-anchor="start" font-weight="400">critical point</text><text x="246.0" y="274.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#26343f" text-anchor="middle" font-weight="400">solid</text><text x="539.0" y="249.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#26343f" text-anchor="middle" font-weight="400">liquid</text><text x="679.0" y="461.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#26343f" text-anchor="middle" font-weight="400">gas</text><text x="480.0" y="576.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#65727d" text-anchor="middle" font-weight="400">schematic, not to scale</text></svg>